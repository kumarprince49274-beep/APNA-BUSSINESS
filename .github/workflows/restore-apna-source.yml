name: Restore Complete APNA BUSINESS Source

on:
  push:
    branches: [main]
    paths:
      - APNA-BUSINESS-SOURCE-FOR-GITHUB.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apna-business-source-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify exact approved source ZIP
        shell: bash
        run: |
          set -euo pipefail
          echo '4587c5913176d8c8382b4b23bb0aac5426a95916e3d9c5717c5f3fabbe329e26  APNA-BUSINESS-SOURCE-FOR-GITHUB.zip' | sha256sum --check

      - name: Restore complete code to correct folder paths
        shell: bash
        run: |
          set -euo pipefail
          unzip -o APNA-BUSINESS-SOURCE-FOR-GITHUB.zip -d .
          test -f src/server.js
          test -f src/auth.js
          test -f src/schema.sql
          test -f src/companies.js
          test -f public/app.js
          test -f public/style.css
          test -f test/accounting.test.js

      - name: Use tested Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - name: Verify JavaScript syntax
        shell: bash
        run: find src public -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run all app tests
        run: npm test

      - name: Commit verified complete source to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f APNA-BUSINESS-SOURCE-FOR-GITHUB.zip
          git add -A
          if git diff --cached --quiet; then
            echo 'Repository already contains the complete tested source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore complete tested APNA BUSINESS source for Render'
          git push origin HEAD:main
