name: Source Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify code syntax
        run: |
          find src public -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run tests
        run: npm test
